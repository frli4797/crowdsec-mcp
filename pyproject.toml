[project]
name = "crowdsec-ops-mcp"
version = "0.3.0"
description = "CrowdSec-focused local MCP server for homelab security operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=2.0.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.1",
  "editables>=0.5",
  "hatchling>=1.26.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
]

[project.scripts]
crowdsec-ops-mcp = "crowdsec_ops_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
