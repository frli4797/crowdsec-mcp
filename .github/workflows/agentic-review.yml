name: Agentic Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: advice.defaultBranchName
  GIT_CONFIG_VALUE_0: "false"
  AGENTIC_REVIEW_MODEL: ${{ vars.AGENTIC_REVIEW_MODEL || 'gpt-5.6-luna' }}

jobs:
  agentic-review:
    name: advisory
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run advisory agentic review
        if: contains(github.event.pull_request.labels.*.name, 'agentic-review')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/agentic_review.py

      - name: Skip advisory agentic review
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'agentic-review') }}
        run: echo "Agentic review skipped: add the agentic-review label to opt in for this PR."
