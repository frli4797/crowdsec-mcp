services:
  crowdsec-ops-mcp:
    image: ghcr.io/frli4797/crowdsec-ops-mcp:0.1.1
    container_name: crowdsec-ops-mcp
    restart: unless-stopped
    environment:
      DEFAULT_WINDOW: 24h
      CROWDSEC_LAPI_URL: http://crowdsec:8080
      CROWDSEC_LAPI_KEY: ${CROWDSEC_LAPI_KEY}
      WRITE_AUDIT_LOG_PATH: /var/log/crowdsec-ops-mcp/write-audit.jsonl
    networks:
      - security

networks:
  security:
    external: true
